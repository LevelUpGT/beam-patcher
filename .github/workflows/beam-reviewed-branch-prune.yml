# 📄 Dosya Yolu: /LevelUpGT/beam-patcher/.github/workflows/beam-reviewed-branch-prune.yml
# 📌 Amac: BEAM icin birlesmis eski duzeltme dalini tarihsel commit etiketiyle guvenle emekliye ayirir
# 📌 Modul - Tool YAML
# Version: 1.0.0
# Aciklama: Eski fix dalini SHA ve ancestry dogrulamasindan sonra tag ile arsivler
# Bagimli Oldugu Katman: Tool

name: BEAM Reviewed Branch Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/beam-reviewed-branch-prune.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: beam-reviewed-branch-prune
  cancel-in-progress: false

jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve and remove reviewed fix branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branch = 'fix/thor-header-and-corruption-guards';
            const expected = '2133fbee37e737489576b73e09e54e72963b7e5d';
            const tag = 'branch-archive/2026-10-11/fix--thor-header-and-corruption-guards';
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const inUse = open.some(pr =>
              pr.base.ref === branch ||
              (pr.head.ref === branch && pr.head.repo?.full_name === `${owner}/${repo}`)
            );
            if (inUse) {
              core.notice('Skip: branch used by an open pull request');
              return;
            }
            let current;
            try {
              current = (await github.rest.repos.getBranch({ owner, repo, branch })).data;
            } catch (err) {
              if (err.status === 404) {
                core.notice('Branch already absent');
                return;
              }
              throw err;
            }
            if (current.protected || current.commit.sha !== expected) {
              core.warning('Skip: protected or unexpected branch HEAD');
              return;
            }
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${branch}...main`
            })).data;
            if (comparison.behind_by !== 0 ||
                !['ahead', 'identical'].includes(comparison.status)) {
              core.warning('Skip: independent commits on old fix branch');
              return;
            }
            let archived;
            try {
              archived = (await github.rest.git.getRef({
                owner, repo, ref: `tags/${tag}`
              })).data.object.sha;
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${tag}`, sha: expected
              });
              archived = (await github.rest.git.getRef({
                owner, repo, ref: `tags/${tag}`
              })).data.object.sha;
            }
            if (archived !== expected) {
              core.warning('Skip: archive tag SHA mismatch');
              return;
            }
            const latest = (await github.rest.git.getRef({
              owner, repo, ref: `heads/${branch}`
            })).data.object.sha;
            if (latest !== expected) {
              core.warning('Skip: branch moved after verification');
              return;
            }
            await github.rest.git.deleteRef({
              owner, repo, ref: `heads/${branch}`
            });
            core.info(`Archived ${branch} at ${expected} as ${tag} and deleted branch`);
            await core.summary
              .addHeading('BEAM reviewed cleanup')
              .addCodeBlock(JSON.stringify({ branch, expected, tag }, null, 2), 'json')
              .write();
