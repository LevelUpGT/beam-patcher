# Dosya Yolu: REPO_ROOT/.github/workflows/dual-installer-policy.yml
# Amac: BURAK-INS-001 Turkuaz primary ve NSIS private fallback'u tek run'da uretme/gate
# Modul - GitHub Actions / Windows dual installer
# Version: 1.0.0-candidate
# Aciklama: Imza/trust/urun E2E olmadan artifact paylasmaz; Inno ve tekli NSIS yok
# Bagimli Oldugu Katman: tools/verify_installer_pair.py | TurkuazLabs/TurkuazInstaller

name: Beam Dual Installer (Turkuaz Primary, NSIS Private)

on:
  pull_request:
    paths:
      - "installer/windows/**"
      - "tools/verify_installer_pair.py"
      - "tools/check_installer_workflows.py"
      - ".github/workflows/**"
      - "docs/INSTALLER-STRATEGY-TURKUAZ.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-dual-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse standalone Inno or NSIS distribution
        run: python tools/check_installer_workflows.py
      - name: Test installer proof gate negative cases
        run: python -m unittest discover -s tools/tests -p 'test_installer_distribution_policy.py' -v

  # Explicitly dispatched only. A PR does NOT produce/share a setup file.
  # A signed Turkuaz product bundle MUST come from a separately secured signing
  # and real installer acceptance process. Missing materials -> fail closed.
  build-both-and-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: policy-contract
    runs-on: windows-latest
    timeout-minutes: 120
    environment: windows-installer-signing
    steps:
      - name: Checkout Beam exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Turkuaz Community source
        uses: actions/checkout@v4
        with:
          repository: TurkuazLabs/TurkuazInstaller
          ref: 1048931bf7498ab4d4440414c4463e6ee5e7421e
          path: build/turkuaz-upstream
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test actual Beam patcher
        shell: pwsh
        run: |
          cargo test -p beam-formats --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p beam-core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p beam-patcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/QA-PATCH-E2E.py --exe target/release/beam-patcher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble Beam Velopack full product package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location).Path 'build/dual-stage'
          $primary = Join-Path (Get-Location).Path 'build/dual-pair/primary'
          New-Item -ItemType Directory -Force -Path $stage, $primary | Out-Null
          Copy-Item target/release/beam-patcher.exe "$stage/beam-patcher.exe"
          Copy-Item installer/windows/config.qa.yml "$stage/config.yml"
          Copy-Item installer/windows/README-QA.txt "$stage/README-QA.txt"
          $tools = Join-Path $env:RUNNER_TEMP 'vpk-tools'
          dotnet tool install vpk --tool-path $tools --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vpk = Join-Path $tools 'vpk.exe'
          $out = Join-Path (Get-Location).Path 'build/dual-vpk'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $vpk --legacyConsole true --yes true --skip-updates true pack --runtime win-x64 --packId levelupgt.beampatcher.qa --packTitle "LevelUp Games Beam QA" --packVersion 1.0.1 --packDir $stage --mainExe beam-patcher.exe --outputDir $out --delta none --skipVeloAppCheck true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem -LiteralPath $out -Filter '*Setup.exe' | Select-Object -First 1
          $nupkg = Get-ChildItem -LiteralPath $out -Filter '*-full.nupkg' | Select-Object -First 1
          if (-not $setup -or -not $nupkg) { throw 'Real Velopack Setup/full nupkg missing' }
          Copy-Item $setup.FullName "$primary/Beam-Velopack-Setup.exe"
          Copy-Item $nupkg.FullName "$primary/Beam-full.nupkg"
      - name: Build genuine TurkuazInstaller Community bootstrapper and companion binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstream = Join-Path (Get-Location).Path 'build/turkuaz-upstream'
          $publish = Join-Path (Get-Location).Path 'build/turkuaz-unsigned'
          $parts = @(
            @('bootstrap', 'src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj'),
            @('winui', 'src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj'),
            @('cli', 'src/TurkuazInstaller.Cli/TurkuazInstaller.Cli.csproj')
          )
          foreach ($part in $parts) {
            dotnet publish (Join-Path $upstream $part[1]) --configuration Release --runtime win-x64 --self-contained true --output (Join-Path $publish $part[0])
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $joined = Join-Path (Get-Location).Path 'build/turkuaz-unsigned/combined'
          & (Join-Path $upstream 'tools/New-CombinedDistribution.ps1') -BootstrapRoot (Join-Path $publish 'bootstrap') -WinUiRoot (Join-Path $publish 'winui') -CliRoot (Join-Path $publish 'cli') -OutputRoot $joined
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $primary = Join-Path (Get-Location).Path 'build/dual-pair/primary'
          Copy-Item -LiteralPath (Join-Path $joined 'TurkuazInstaller.Bootstrapper.exe') -Destination $primary
          Copy-Item -LiteralPath (Join-Path $joined 'app') -Destination (Join-Path $primary 'app') -Recurse
          Copy-Item -LiteralPath (Join-Path $joined 'cli') -Destination (Join-Path $primary 'cli') -Recurse
      - name: Build NSIS BACKUP from exact same Beam source (never upload separately)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Join-Path "${env:ProgramFiles(x86)}" 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $nsis)) { throw 'NSIS unavailable' }
          $out = Join-Path (Get-Location).Path 'build/dual-pair/backup'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = (Resolve-Path target/release/beam-patcher.exe).Path
          & $nsis '/V2' "/DBeamExe=$exe" "/DNsisOut=$out" 'installer/windows/BeamPatcher-NSIS-Backup.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $out 'LevelUpGames-Beam-NSIS-BACKUP-QA-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'NSIS backup output missing' }
          # No NSIS artifacts are uploaded or released from this job.
      - name: Verify trusted Turkuaz signing, detached manifest and native E2E proof
        shell: pwsh
        env:
          VERIFIED_SIGNED_BUNDLE: ${{ vars.BEAM_VERIFIED_TURKUAZ_BUNDLE }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The signed bundle is produced/provisioned separately, in a protected
          # Windows signing environment. A missing or unverifiable bundle is FAIL.
          $trusted = $env:VERIFIED_SIGNED_BUNDLE
          if ([string]::IsNullOrWhiteSpace($trusted) -or -not (Test-Path -LiteralPath $trusted -PathType Container)) {
            throw 'BURAK-INS-001: NO TRUSTED TURKUAZ SIGNER / E2E BUNDLE. Pair is NOT shareable.'
          }
          $primary = Join-Path (Get-Location).Path 'build/dual-pair/primary'
          foreach ($item in @('installer-manifest.yml', 'installer-manifest.yml.p7s', 'manifest-trust.yml', 'dual-e2e.json')) {
            $src = Join-Path $trusted $item
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { throw "Required signed evidence missing: $item" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $primary $item)
          }
          # Production signed binaries must be installed by the trusted signer;
          # an unsigned bootstrapper built above cannot be distributed.
          $signedBootstrap = Join-Path $trusted 'TurkuazInstaller.Bootstrapper.exe'
          if (-not (Test-Path -LiteralPath $signedBootstrap)) { throw 'Signed Turkuaz bootstrapper missing' }
          Copy-Item -LiteralPath $signedBootstrap -Destination (Join-Path $primary 'TurkuazInstaller.Bootstrapper.exe') -Force
          $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $primary 'TurkuazInstaller.Bootstrapper.exe')
          if ($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate) { throw "Turkuaz Authenticode invalid: $($sig.Status)" }
          # Full CMS signed manifest and external certificate pin verification
          # belongs to TurkuazInstaller CLI trusted runtime acceptance.
          $evidence = Join-Path $trusted 'dual-e2e.json'
          Copy-Item -LiteralPath $evidence -Destination (Join-Path (Get-Location).Path 'build/dual-evidence.json')
      - name: Fail-closed exact hash/role/E2E gate
        shell: pwsh
        run: |
          python tools/verify_installer_pair.py --bundle build/dual-pair --evidence build/dual-evidence.json --source-sha "${{ github.sha }}" --version 1.0.1 --report build/dual-pair/primary/distribution-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload only the verified primary TurkuazInstaller files (NOT NSIS)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TURKUAZ-PRIMARY-BEAM-QA-${{ github.sha }}
          path: build/dual-pair/primary/
          if-no-files-found: error
          retention-days: 3
