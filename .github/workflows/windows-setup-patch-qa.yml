# Dosya Yolu: .github/workflows/windows-setup-patch-qa.yml
# Amac: Windows x64 Beam QA patch E2E ve YAYINLANMAYAN NSIS fallback smoke
# Modul - GitHub Actions / Windows-only QA
# Version: 0.3.0-candidate
# Aciklama: BURAK-INS-001 geregi tekli Inno/NSIS artifactini yayinlama yok
# Bagimli Oldugu Katman: installer/windows/* | tools/QA-PATCH-E2E.py

name: Beam Windows Patch QA and Private NSIS Smoke

on:
  pull_request:
    paths:
      - "installer/windows/**"
      - "beam-ui/**"
      - "beam-patcher/**"
      - "beam-core/**"
      - "beam-formats/**"
      - "tools/QA-PATCH-E2E.py"
      - "tools/check_installer_workflows.py"
      - "tools/verify_installer_pair.py"
      - "tools/tests/prepare_rust_beam_fixture.py"
      - "tools/build_map_beam.py"
      - ".github/workflows/windows-setup-patch-qa.yml"
  push:
    branches:
      - feat/windows-setup-patch-qa-20261025
    paths:
      - "installer/windows/**"
      - "beam-ui/**"
      - "beam-patcher/**"
      - "beam-core/**"
      - "beam-formats/**"
      - "tools/QA-PATCH-E2E.py"
      - ".github/workflows/windows-setup-patch-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest branch/PR build; never waste runners on superseded QA.
concurrency:
  group: beam-windows-setup-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-qa-installer:
    name: Windows x64 Rust BEAM E2E and installer
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout safe QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: beam-windows-setup-qa
      - name: Test binary format and patcher core
        run: |
          cargo test -p beam-formats --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p beam-core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: Build actual Beam/Tauri Windows executable
        run: cargo build --release -p beam-patcher
      - name: Synthetic BEAM download -> GRF 0x200 -> cached rerun -> corrupt SHA refusal
        run: |
          python tools/QA-PATCH-E2E.py --exe target/release/beam-patcher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: Check installer workflow policy
        run: python tools/check_installer_workflows.py
      - name: Locate or install NSIS fallback compiler (private QA)
        shell: pwsh
        run: |
          $makensis = Join-Path "${env:ProgramFiles(x86)}" 'NSIS/makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $makensis)) { throw 'NSIS backup compiler not available' }
          "BEAM_NSIS_COMPILER=$makensis" >> $env:GITHUB_ENV
      - name: Build NSIS recovery setup for isolated runner smoke (NO upload)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target/release/beam-patcher.exe').Path
          $output = Join-Path (Get-Location).Path 'build/private-nsis-smoke'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $env:BEAM_NSIS_COMPILER '/V2' "/DBeamExe=$exe" "/DNsisOut=$output" 'installer/windows/BeamPatcher-NSIS-Backup.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $output 'TurkuazRagnarokOnline-NSIS-BACKUP-QA-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'NSIS backup setup missing' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/TurkuazSoft/Turkuaz Ragnarok Online QA-NSIS-Backup'
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "NSIS fallback install failed $($process.ExitCode)" }
          $config = Join-Path $installed 'config.yml'
          $binary = Join-Path $installed 'beam-patcher.exe'
          if (-not (Test-Path $binary) -or -not (Test-Path $config)) { throw 'NSIS installed payload incomplete' }
          $configRaw = Get-Content -LiteralPath $config -Raw
          if (-not $configRaw.Contains('qa_only: true')) { throw 'NSIS must preserve the safe QA policy' }
          if (-not $configRaw.Contains('NO_CLIENT_CONFIGURED.exe')) { throw 'NSIS must not launch a game' }
          $uninst = Join-Path $installed 'Uninstall-NSIS-Backup.exe'
          if (-not (Test-Path $uninst)) { throw 'NSIS uninstaller missing' }
          $done = Start-Process -FilePath $uninst -ArgumentList '/S' -PassThru -Wait
          if ($done.ExitCode -ne 0) { throw "NSIS fallback uninstall failed $($done.ExitCode)" }
          if (Test-Path $binary) { throw 'NSIS uninstall left executable behind' }
          Write-Host 'PRIVATE_NSIS_QA_OK -- never present this artifact to end users'
      - name: No standalone installer publication without Turkuaz dual gate
        shell: pwsh
        run: |
          Write-Host 'BURAK-INS-001: This is build/smoke QA ONLY.'
          Write-Host 'No Inno, NSIS or single installer artifact is published.'
          Write-Host 'Only a separate Turkuaz+NSIS dual gate can authorize distribution.'
